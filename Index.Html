<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Reparaciones</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f14;
      color: #e4e4e7;
      min-height: 100vh;
    }
    .screen { display: none; padding: 16px; max-width: 720px; margin: 0 auto; }
    .screen.active { display: block; }

    /* Header */
    .header {
      text-align: center;
      padding: 20px 0 12px;
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .header p { font-size: 0.85rem; color: #a1a1aa; margin-top: 4px; }

    /* Search */
    .search-wrap {
      position: sticky; top: 0; z-index: 10;
      background: #0f0f14;
      padding: 12px 0;
    }
    .search-wrap input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #27272a;
      background: #18181b;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .search-wrap input:focus { border-color: #6366f1; }
    .search-wrap input::placeholder { color: #71717a; }

    /* Brand group */
    .brand-group { margin-bottom: 20px; }
    .brand-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6366f1;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .grid-item {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .grid-item:hover { border-color: #6366f1; background: #1c1c22; transform: translateY(-1px); }
    .grid-item:active { transform: scale(0.97); }

    /* Phone card */
    .phone-img {
      width: 48px; height: 80px;
      margin: 0 auto 10px;
      background: #27272a;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .phone-name { font-size: 0.8rem; font-weight: 500; color: #e4e4e7; line-height: 1.3; }

    /* Category card */
    .cat-img {
      width: 100%; height: 80px;
      background: #1e1e24;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      color: #71717a;
      border: 1px dashed #3f3f46;
    }
    .cat-name { font-size: 0.82rem; font-weight: 500; color: #e4e4e7; }

    /* Component list */
    .comp-list { display: flex; flex-direction: column; gap: 10px; }
    .comp-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 14px 16px;
    }
    .comp-name { font-size: 0.9rem; font-weight: 500; margin-bottom: 10px; }
    .comp-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background .15s;
    }
    .comp-btn:hover { background: #15803d; }
    .comp-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* Diagnostic button */
    .diag-section { margin-top: 24px; text-align: center; }
    .diag-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background .15s;
    }
    .diag-btn:hover { background: #4f46e5; }

    /* Back button */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1px solid #3f3f46;
      color: #a1a1aa;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all .15s;
    }
    .back-btn:hover { border-color: #6366f1; color: #fff; }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 0.8rem;
      color: #71717a;
      margin-bottom: 16px;
    }
    .breadcrumb span { color: #e4e4e7; font-weight: 500; }

    /* No results */
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #71717a;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- PANTALLA 1: Modelos -->
  <div id="screen1" class="screen active">
    <div class="header">
      <h1>🔧 Catálogo de Reparaciones</h1>
      <p>Elegí tu modelo de celular</p>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Buscar modelo... (ej: iPhone 15, Galaxy S24)" autocomplete="off">
    </div>
    <div id="phone-grid"></div>
    <div id="no-results" class="no-results" style="display:none">No se encontraron modelos. Probá con otro nombre.</div>
  </div>

  <!-- PANTALLA 2: Categorías -->
  <div id="screen2" class="screen">
    <button class="back-btn" onclick="showScreen(1)">← Volver a modelos</button>
    <div class="breadcrumb">Modelo: <span id="s2-phone-name"></span></div>
    <div class="header">
      <h1>¿Qué zona necesita reparación?</h1>
      <p>Elegí la categoría correspondiente</p>
    </div>
    <div id="cat-grid" class="grid"></div>
  </div>

  <!-- PANTALLA 3: Componentes -->
  <div id="screen3" class="screen">
    <button class="back-btn" onclick="showScreen(2)">← Volver a categorías</button>
    <div class="breadcrumb">
      <span id="s3-phone-name"></span> → <span id="s3-cat-name"></span>
    </div>
    <div class="header">
      <h1>Componentes disponibles</h1>
      <p>Elegí el componente a reparar</p>
    </div>
    <div id="comp-list" class="comp-list"></div>
    <div class="diag-section">
      <a id="diag-link" class="diag-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-2h2v2h-2zm0-4V7h2v6h-2z"/></svg>
        No sé qué tiene mi dispositivo → Pedir diagnóstico
      </a>
    </div>
  </div>

  <script>
    // ====== CONFIG ======
    const MSG_DIAGNOSTICO = "Hola, no sé qué es lo que tiene mi dispositivo, puedo explicarle qué le pasó y así hacer un diagnóstico?";
    const MSG_COTIZACION = (componente, modelo) => `Hola, quiero reparar este ${componente} de mi ${modelo}, ¿cuál sería el precio?`;
    // ====================

    let DATA = null;
    let selectedPhone = null;
    let selectedCategory = null;

    // Load data
    fetch('data.json')
      .then(r => r.json())
      .then(d => { DATA = d; renderPhones(); })
      .catch(err => {
        document.getElementById('phone-grid').innerHTML = '<p style="color:#ef4444">Error al cargar data.json. Verificá que el archivo esté en la misma carpeta.</p>';
      });

    function waLink(msg) {
      return `https://wa.me/${DATA.whatsapp_number}?text=${encodeURIComponent(msg)}`;
    }

    // ====== NAVIGATION ======
    function showScreen(n) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(`screen${n}`).classList.add('active');
      window.scrollTo(0, 0);
    }

    // ====== PANTALLA 1: Phones ======
    function renderPhones(filter = '') {
      const container = document.getElementById('phone-grid');
      const noResults = document.getElementById('no-results');
      container.innerHTML = '';

      const brands = {};
      DATA.phones.forEach(p => {
        const q = filter.toLowerCase();
        if (q && !p.name.toLowerCase().includes(q) && !p.brand.toLowerCase().includes(q)) return;
        if (!brands[p.brand]) brands[p.brand] = [];
        brands[p.brand].push(p);
      });

      const hasResults = Object.keys(brands).length > 0;
      noResults.style.display = hasResults ? 'none' : 'block';

      Object.entries(brands).forEach(([brand, phones]) => {
        const group = document.createElement('div');
        group.className = 'brand-group';
        group.innerHTML = `<div class="brand-label">${brand}</div>`;
        const grid = document.createElement('div');
        grid.className = 'grid';
        phones.forEach(p => {
          const item = document.createElement('div');
          item.className = 'grid-item';
          item.innerHTML = `
            <div class="phone-img">📱</div>
            <div class="phone-name">${p.name}</div>
          `;
          item.onclick = () => selectPhone(p);
          grid.appendChild(item);
        });
        group.appendChild(grid);
        container.appendChild(group);
      });
    }

    document.getElementById('search').addEventListener('input', e => {
      renderPhones(e.target.value.trim());
    });

    // ====== PANTALLA 2: Categories ======
    function selectPhone(phone) {
      selectedPhone = phone;
      document.getElementById('s2-phone-name').textContent = phone.name;
      renderCategories();
      showScreen(2);
    }

    function renderCategories() {
      const grid = document.getElementById('cat-grid');
      grid.innerHTML = '';
      DATA.categories.forEach(cat => {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `
          <div class="cat-img">[ imagen ]</div>
          <div class="cat-name">${cat.name}</div>
        `;
        item.onclick = () => selectCategory(cat);
        grid.appendChild(item);
      });
    }

    // ====== PANTALLA 3: Components ======
    function selectCategory(cat) {
      selectedCategory = cat;
      document.getElementById('s3-phone-name').textContent = selectedPhone.name;
      document.getElementById('s3-cat-name').textContent = cat.name;

      const list = document.getElementById('comp-list');
      list.innerHTML = '';
      cat.components.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'comp-card';
        const msg = MSG_COTIZACION(comp, selectedPhone.name);
        card.innerHTML = `
          <div class="comp-name">${comp}</div>
          <a class="comp-btn" href="${waLink(msg)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Pedir precio
          </a>
        `;
        list.appendChild(card);
      });

      // Diagnostic button
      const diagMsg = MSG_DIAGNOSTICO;
      document.getElementById('diag-link').href = waLink(diagMsg);

      showScreen(3);
    }
  </script>
</body>
</html>
